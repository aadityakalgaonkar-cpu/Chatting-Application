{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#0f172a;
            color:white;
        }

        a{
            text-decoration:none;
        }

        {% block css %}{% endblock %}

    </style>

</head>
<body>

{% block content %}

{% endblock %}

</body>
</html>
